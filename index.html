<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarwa Chronic</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta name="theme-color" content="#13353a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sarwa Chronic">
<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --surface-2:#eef1f5; --surface-3:#e4e8ee; --text:#18212b; --muted:#5e6b7a; --border:#dbe1e8;
  --accent:#0d6b6b; --accent-ink:#fff; --accent-soft:#dff0ee; --rail:#13353a; --rail-ink:#cfe3e1; --rail-active:#2a5a5f;
  --ok:#1b7344; --ok-bg:#e1f3e8; --warn:#8a5200; --warn-bg:#fcefd5; --bad:#b0281c; --bad-bg:#fbe4e1; --info:#1d5ca8; --info-bg:#e3edfa;
  --note:#fff8dc; --note-border:#efd98a; --low:#6b8f71; --med:#2f6fb0; --high:#d08a12; --urgent:#c4321f;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#161c23; --surface-2:#1d252e; --surface-3:#26303b; --text:#e5eaef; --muted:#98a4b2; --border:#2a3440;
  --accent:#45b8b0; --accent-ink:#04201e; --accent-soft:#15302e; --rail:#0b2226; --rail-ink:#a9c7c4; --rail-active:#1d4246;
  --ok:#62d093; --ok-bg:#14301f; --warn:#f0b357; --warn-bg:#33270f; --bad:#ff8b7f; --bad-bg:#3a1714; --info:#82b4f2; --info-bg:#15263b;
  --note:#2e2a14; --note-border:#5b5226; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161c23; --surface-2:#1d252e; --surface-3:#26303b; --text:#e5eaef; --muted:#98a4b2; --border:#2a3440;
  --accent:#45b8b0; --accent-ink:#04201e; --accent-soft:#15302e; --rail:#0b2226; --rail-ink:#a9c7c4; --rail-active:#1d4246;
  --ok:#62d093; --ok-bg:#14301f; --warn:#f0b357; --warn-bg:#33270f; --bad:#ff8b7f; --bad-bg:#3a1714; --info:#82b4f2; --info-bg:#15263b;
  --note:#2e2a14; --note-border:#5b5226; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:64px minmax(0,1fr);height:100vh}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:10px}
.rail a{position:relative;width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--rail-ink);text-decoration:none}
.rail a:hover{background:var(--rail-active)}
.rail a.on{background:var(--rail-active);color:#fff}
.rail a svg{width:22px;height:22px}
.rail a .cnt{position:absolute;top:3px;right:2px;background:var(--urgent);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
.rail a[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;background:#111;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:20}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px}
.top h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
.top .search{flex:1 1 auto;max-width:440px;position:relative}
.top .search input{width:100%;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.top .grow{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy .dot{background:var(--warn)} .sync.err .dot{background:var(--bad)}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 3px;background:var(--surface);cursor:pointer;white-space:nowrap}
.view{flex:1;overflow:auto;min-height:0}
.pad{padding:16px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 13px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--border);border-radius:7px;padding:6px 9px;background:var(--surface);min-width:0}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:650;white-space:nowrap;line-height:18px}
.p-new{background:var(--info-bg);color:var(--info)} .p-resp{background:var(--accent-soft);color:var(--accent)}
.p-over{background:var(--bad-bg);color:var(--bad)} .p-due{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-muted{background:var(--surface-2);color:var(--muted)} .p-note{background:var(--note);color:var(--warn);border:1px solid var(--note-border)}
.st{font-size:12px;font-weight:650;border-radius:6px;padding:1px 7px;white-space:nowrap}
.st-Open{background:var(--info-bg);color:var(--info)} .st-Pending,.st-Waiting{background:var(--warn-bg);color:var(--warn)}
.st-Resolved{background:var(--ok-bg);color:var(--ok)} .st-Closed{background:var(--surface-2);color:var(--muted)}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.pri::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--med)}
.pri-Low::before{background:var(--low)} .pri-High::before{background:var(--high)} .pri-Urgent::before{background:var(--urgent)}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.av.sm{width:24px;height:24px;font-size:10.5px}
/* tickets list */
.lt{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
/* ---- views sidebar ---- */
/* the folder pane scrolls on its own and always fits the visible area under the top bar (it used to be 100vh tall, so the last
   entries – Closed, All tickets – were hidden below the window) */
.view{container-type:size}
.fpane{border-right:1px solid var(--border);background:var(--surface);padding:12px 10px 28px;position:sticky;top:0;align-self:start;max-height:calc(100vh - 57px);max-height:100cqh;overflow-y:auto;overscroll-behavior:contain;font-size:13.5px;box-sizing:border-box}
.fpane h4{margin:16px 8px 6px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.fpane h4:first-child{margin-top:4px}
.fpane .sub a{padding-left:24px;font-size:12.5px}
.ce.drop{outline:2px dashed var(--accent);outline-offset:-4px;background:var(--accent-soft)}
.ce img{max-width:100%;height:auto}
.fpane a{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden;position:relative;line-height:1.35}
.fpane a .ico{width:16px;text-align:center;color:var(--muted);font-size:12px;flex:none}
.fpane a span.nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.fpane a b.n{font-weight:600;font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:999px;padding:0 7px;line-height:19px;font-variant-numeric:tabular-nums}
.fpane a.bad b.n{background:var(--bad-bg);color:var(--bad)} .fpane a.warn b.n{background:var(--warn-bg);color:var(--warn)}
.fpane a:hover{background:var(--surface-2)}
.fpane a.on{background:var(--accent-soft);color:var(--accent);font-weight:650} .fpane a.on .ico{color:var(--accent)} .fpane a.on b.n{background:var(--accent);color:#fff}
.fpane a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--accent)}
.fpane .dot{width:9px;height:9px;border-radius:3px;flex:none;margin:0 3px}
.fpane .ed{visibility:hidden;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px} .fpane a:hover .ed{visibility:visible}
/* ---- list header ---- */
.lhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 18px 0;display:grid;gap:10px}
.lhead .hrow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start;justify-content:space-between}
.vtitle{min-width:0} .vtitle h2{margin:0;font-size:19px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle .count{font-size:12.5px;font-weight:650;color:var(--muted);background:var(--surface-3);border-radius:999px;padding:1px 9px;font-variant-numeric:tabular-nums}
.vtitle .dot{width:11px;height:11px;border-radius:3px;flex:none}
.vtitle select.viewsel{display:none;font-size:13px;max-width:180px}
.lhead .tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lhead .tools select{font-size:12.5px;padding:4px 8px}
.chip .x{border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 4px;font-size:13px}
.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:9px;padding:6px 10px}
/* ---- ticket table ---- */
.lt{--cols:104px 96px 156px 104px 70px}
.thead,.tr{display:grid;grid-template-columns:20px 26px minmax(0,1fr) auto;gap:12px;align-items:center}
.thead .cols,.tr .cols{display:grid;grid-template-columns:var(--cols);gap:10px;align-items:center}
.thead{padding:8px 14px;border:1px solid var(--border);border-bottom:0;border-radius:10px 10px 0 0;background:var(--surface-2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.thead .th{border:0;background:none;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;text-align:left;cursor:pointer}
.thead .th:hover,.thead .th.on{color:var(--accent)} .thead span.th{cursor:default}
.tl{padding:0 18px 28px}
.tl>.tr:last-of-type{border-radius:0 0 10px 10px}
.tr{position:relative;background:var(--surface);border:1px solid var(--border);border-top:0;padding:9px 14px 9px 14px;cursor:pointer;transition:background .12s}
.tr::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--med)}
.tr.pri-Low::before{background:var(--low)} .tr.pri-High::before{background:var(--high)} .tr.pri-Urgent::before{background:var(--urgent)}
.tr:hover{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
.tr.sel{background:var(--accent-soft)}
.tr .tmain{min-width:0}
.tr .l1{display:flex;align-items:center;gap:8px;min-width:0}
.tr .subj{font-weight:600;font-size:14px;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.tr.fresh .subj{font-weight:700}
.tr .subj:hover{color:var(--accent)}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--info);flex:none;box-shadow:0 0 0 3px var(--info-bg)}
.tr .chips{display:flex;gap:4px;flex:0 100 auto;overflow:hidden;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;line-height:19px;padding:0 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:2px;display:inline-block}
.chip.q{background:var(--surface-3);color:var(--text)} .chip.c-resp{background:var(--accent-soft);color:var(--accent)} .chip.c-ai{background:#f1ebfb;color:#6a3fb0}
.chip.c-ok{background:var(--ok-bg);color:var(--ok)} .chip.c-bad{background:var(--bad-bg);color:var(--bad)} .chip.c-tag{background:transparent;border:1px solid var(--border)}
.tr .meta{font-size:12px;color:var(--muted);display:flex;gap:2px 0;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .meta>span+span::before{content:"·";margin:0 7px;color:var(--border)}
.tr .meta .mono{font-variant-numeric:tabular-nums}
.csel{appearance:none;-webkit-appearance:none;border:1px solid transparent;background:transparent;font:inherit;font-size:12.5px;padding:3px 8px;border-radius:6px;width:100%;cursor:pointer;color:var(--text);text-overflow:ellipsis;white-space:nowrap;overflow:hidden}
.csel:hover,.csel:focus{border-color:var(--border);background:var(--surface);outline:none}
.csel.muted{color:var(--muted)}
.csel.st{font-weight:650;font-size:12px;border-radius:6px} .csel.st-Open{background:var(--info-bg);color:var(--info)} .csel.st-Pending,.csel.st-Waiting{background:var(--warn-bg);color:var(--warn)} .csel.st-Resolved{background:var(--ok-bg);color:var(--ok)} .csel.st-Closed{background:var(--surface-2);color:var(--muted)}
.c-pr,.c-ag{display:flex;align-items:center;gap:6px;min-width:0}
.pdot{width:9px;height:9px;border-radius:2px;flex:none;background:var(--med)} .pd-Low{background:var(--low)} .pd-High{background:var(--high)} .pd-Urgent{background:var(--urgent)}
.av.noag{background:var(--surface-3)!important;color:var(--muted)}
.sla{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sla.ok{background:var(--ok-bg);color:var(--ok)} .sla.warn{background:var(--warn-bg);color:var(--warn)} .sla.bad{background:var(--bad-bg);color:var(--bad)} .sla.mut{background:var(--surface-2);color:var(--muted)}
.c-up{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
@media (max-width:1180px){.lt{--cols:110px 96px 150px 100px}.c-up,.thead .cols>.th:last-child{display:none}}
@media (max-width:760px){
  .thead{display:none}.tl{padding:0 10px 24px}.lhead{padding:12px 10px 0}
  .tr{grid-template-columns:20px minmax(0,1fr);border-top:1px solid var(--border);border-radius:10px!important;margin-bottom:8px}
  .tr .avcell{display:none} .tr .cols{grid-column:2;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tr .c-sla{grid-column:1/-1} .tr .meta{white-space:normal;flex-wrap:wrap}
  .vtitle select.viewsel{display:inline-block}
}
@media (max-width:1000px){.vtitle select.viewsel{display:inline-block}}
/* ---- filters panel ---- */
.filters{border-left:1px solid var(--border);background:var(--surface);padding:16px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.filters h3{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
.filters label.ck{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0;cursor:pointer}
.filters label.ck input{width:auto;margin:0;flex:none}
.filters select,.filters input[type=text]{width:100%}
.eye{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:2px 0 10px 26px}
.eye canvas{border:1px solid var(--border);border-radius:6px;background:#fff;cursor:zoom-in;max-width:min(560px,100%)}
.eye .hist{font-size:12.5px;padding:6px 9px;border-radius:7px;background:var(--surface-2);max-width:460px}
.hist-act{color:#2f8a4f;font-weight:650} .hist-exp{color:var(--muted)}
.hpanel{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.hpanel .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.hpanel .chips span{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:12px}
.medf{display:flex;align-items:center;gap:2px}
.medf input{width:200px}
.medpop{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:320px;overflow:auto;padding:4px}
.medopt{display:grid;gap:1px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.medopt:hover,.medopt.on{background:var(--accent-soft)}
.medopt.de{border-top:1px solid var(--border);margin-top:4px;color:var(--accent);font-weight:600}
.rev{position:sticky;left:0;box-sizing:border-box;width:calc(min(1180px,100vw - 16px) - 90px);display:grid;grid-template-columns:minmax(0,auto) minmax(220px,1fr) auto;gap:14px;align-items:start;margin:0 0 6px 26px;padding:10px 12px;border:1px solid var(--border);border-left:4px solid #c98a00;border-radius:10px;background:var(--surface)}
.rev.ok{border-left-color:#2f8a4f;background:linear-gradient(90deg,rgba(47,138,79,.06),transparent 40%)}
@media (max-width:900px){.rev{grid-template-columns:minmax(0,1fr)}}
.rev .crop{display:grid;gap:4px}
.rev .crop canvas{border:1px solid var(--border);border-radius:6px;background:#fff;cursor:zoom-in;max-width:min(520px,100%)}
.rev .nopic{width:260px;height:64px;border:1px dashed var(--border);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:4px}
.rev .side{display:grid;gap:6px;font-size:12.5px}
.rev .act{display:grid;gap:6px;justify-items:end;min-width:150px}
.btn.confirm{border:1.5px solid #2f8a4f;color:#2f8a4f;background:transparent;font-weight:650}
.btn.confirm:hover{background:#2f8a4f;color:#fff}
.okpill{background:#2f8a4f;color:#fff;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:650;white-space:nowrap}
.sugg{background:#fff7e0;border:1px solid #f0d58a;border-radius:7px;padding:5px 8px}
.progress{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.progress .bar2{width:120px;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress .bar2 i{display:block;height:100%;background:#2f8a4f}
#dlg2{width:min(1100px,calc(100vw - 24px))}
#dlg2 .stage{position:relative;overflow:auto;max-height:75vh;background:#222;border-radius:8px}
#dlg2 canvas{display:block;cursor:crosshair;max-width:100%}
.filters{display:none} .filters.show{display:block;position:fixed;right:0;top:0;bottom:0;z-index:30;width:300px;max-height:none;box-shadow:-10px 0 34px rgba(0,0,0,.18);animation:slidein .18s ease-out}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:1000px){.lt{grid-template-columns:minmax(0,1fr)} .fpane{display:none}}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
/* ticket view */
.tv{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:100%}
@media (max-width:1000px){.tv{grid-template-columns:minmax(0,1fr)}}
.tv .left{padding:14px 18px 40px;min-width:0}
.tv .side{border-left:1px solid var(--border);background:var(--surface);padding:14px}
.tbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.tsub{font-size:20px;line-height:1.3;margin:4px 0 6px;font-weight:650;overflow-wrap:anywhere}
.msg{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin:12px 0;overflow:hidden}
.msg.out{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.msg.note{background:var(--note);border-color:var(--note-border)}
.msg .mh{display:flex;gap:10px;align-items:flex-start;padding:10px 14px 0}
.msg .mh .who{font-weight:650}
.msg .mb{padding:8px 14px 12px 54px;white-space:pre-wrap;overflow-wrap:anywhere}

function exportCsv(tickets) {
