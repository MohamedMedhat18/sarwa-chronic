<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sarwa Chronic</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta name="theme-color" content="#13353a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sarwa Chronic">
<style>
:root{
  --bg:#f3f5f8; --surface:#fff; --surface-2:#eef1f5; --surface-3:#e4e8ee; --text:#18212b; --muted:#5e6b7a; --border:#dbe1e8;
  --accent:#0d6b6b; --accent-ink:#fff; --accent-soft:#dff0ee; --rail:#13353a; --rail-ink:#cfe3e1; --rail-active:#2a5a5f;
  --ok:#1b7344; --ok-bg:#e1f3e8; --warn:#8a5200; --warn-bg:#fcefd5; --bad:#b0281c; --bad-bg:#fbe4e1; --info:#1d5ca8; --info-bg:#e3edfa;
  --note:#fff8dc; --note-border:#efd98a; --low:#6b8f71; --med:#2f6fb0; --high:#d08a12; --urgent:#c4321f;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06); color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1318; --surface:#161c23; --surface-2:#1d252e; --surface-3:#26303b; --text:#e5eaef; --muted:#98a4b2; --border:#2a3440;
  --accent:#45b8b0; --accent-ink:#04201e; --accent-soft:#15302e; --rail:#0b2226; --rail-ink:#a9c7c4; --rail-active:#1d4246;
  --ok:#62d093; --ok-bg:#14301f; --warn:#f0b357; --warn-bg:#33270f; --bad:#ff8b7f; --bad-bg:#3a1714; --info:#82b4f2; --info-bg:#15263b;
  --note:#2e2a14; --note-border:#5b5226; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1318; --surface:#161c23; --surface-2:#1d252e; --surface-3:#26303b; --text:#e5eaef; --muted:#98a4b2; --border:#2a3440;
  --accent:#45b8b0; --accent-ink:#04201e; --accent-soft:#15302e; --rail:#0b2226; --rail-ink:#a9c7c4; --rail-active:#1d4246;
  --ok:#62d093; --ok-bg:#14301f; --warn:#f0b357; --warn-bg:#33270f; --bad:#ff8b7f; --bad-bg:#3a1714; --info:#82b4f2; --info-bg:#15263b;
  --note:#2e2a14; --note-border:#5b5226; --shadow:none; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:64px minmax(0,1fr);height:100vh}
.rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
.rail .logo{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:800;margin-bottom:10px}
.rail a{position:relative;width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--rail-ink);text-decoration:none}
.rail a:hover{background:var(--rail-active)}
.rail a.on{background:var(--rail-active);color:#fff}
.rail a svg{width:22px;height:22px}
.rail a .cnt{position:absolute;top:3px;right:2px;background:var(--urgent);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px}
.rail a[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;background:#111;color:#fff;font-size:12px;padding:3px 8px;border-radius:6px;white-space:nowrap;z-index:20}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{height:56px;flex:none;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 16px}
.top h1{font-size:16px;margin:0 8px 0 0;white-space:nowrap}
.top .search{flex:1 1 auto;max-width:440px;position:relative}
.top .search input{width:100%;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2)}
.top .grow{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.sync.busy .dot{background:var(--warn)} .sync.err .dot{background:var(--bad)}
.me{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:20px;padding:3px 10px 3px 3px;background:var(--surface);cursor:pointer;white-space:nowrap}
.view{flex:1;overflow:auto;min-height:0}
.pad{padding:16px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 13px;cursor:pointer;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--border);border-radius:7px;padding:6px 9px;background:var(--surface);min-width:0}
textarea{resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:650;white-space:nowrap;line-height:18px}
.p-new{background:var(--info-bg);color:var(--info)} .p-resp{background:var(--accent-soft);color:var(--accent)}
.p-over{background:var(--bad-bg);color:var(--bad)} .p-due{background:var(--warn-bg);color:var(--warn)}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-muted{background:var(--surface-2);color:var(--muted)} .p-note{background:var(--note);color:var(--warn);border:1px solid var(--note-border)}
.st{font-size:12px;font-weight:650;border-radius:6px;padding:1px 7px;white-space:nowrap}
.st-Open{background:var(--info-bg);color:var(--info)} .st-Pending,.st-Waiting{background:var(--warn-bg);color:var(--warn)}
.st-Resolved{background:var(--ok-bg);color:var(--ok)} .st-Closed{background:var(--surface-2);color:var(--muted)}
.pri{display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.pri::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--med)}
.pri-Low::before{background:var(--low)} .pri-High::before{background:var(--high)} .pri-Urgent::before{background:var(--urgent)}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff}
.av.sm{width:24px;height:24px;font-size:10.5px}
/* tickets list */
.lt{display:grid;grid-template-columns:210px minmax(0,1fr) 260px;min-height:100%}
.fpane{border-right:1px solid var(--border);background:var(--surface);padding:10px 8px 24px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;font-size:13.5px}
.fpane h4{margin:14px 8px 4px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.fpane a{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:7px;color:var(--text);text-decoration:none;white-space:nowrap;overflow:hidden}
.fpane a span.nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.fpane a b{font-weight:600;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fpane a:hover{background:var(--surface-2)} .fpane a.on{background:var(--accent-soft);color:var(--accent);font-weight:650} .fpane a.on b{color:var(--accent)}
.fpane .dot{width:9px;height:9px;border-radius:3px;flex:none}
.fpane .ed{visibility:hidden;border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px} .fpane a:hover .ed{visibility:visible}
.eye{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;padding:2px 0 10px 26px}
.eye canvas{border:1px solid var(--border);border-radius:6px;background:#fff;cursor:zoom-in;max-width:min(560px,100%)}
.eye .hist{font-size:12.5px;padding:6px 9px;border-radius:7px;background:var(--surface-2);max-width:460px}
.hist-act{color:#2f8a4f;font-weight:650} .hist-exp{color:var(--muted)}
.hpanel{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--surface-2)}
.hpanel .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.hpanel .chips span{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2px 9px;font-size:12px}
.medf{display:flex;align-items:center;gap:2px}
.medf input{width:200px}
.medpop{position:fixed;z-index:1000;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.18);max-height:320px;overflow:auto;padding:4px}
.medopt{display:grid;gap:1px;padding:7px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.medopt:hover,.medopt.on{background:var(--accent-soft)}
.medopt.de{border-top:1px solid var(--border);margin-top:4px;color:var(--accent);font-weight:600}
.rev{position:sticky;left:0;box-sizing:border-box;width:calc(min(1180px,100vw - 16px) - 90px);display:grid;grid-template-columns:minmax(0,auto) minmax(220px,1fr) auto;gap:14px;align-items:start;margin:0 0 6px 26px;padding:10px 12px;border:1px solid var(--border);border-left:4px solid #c98a00;border-radius:10px;background:var(--surface)}
.rev.ok{border-left-color:#2f8a4f;background:linear-gradient(90deg,rgba(47,138,79,.06),transparent 40%)}
@media (max-width:900px){.rev{grid-template-columns:minmax(0,1fr)}}
.rev .crop{display:grid;gap:4px}
.rev .crop canvas{border:1px solid var(--border);border-radius:6px;background:#fff;cursor:zoom-in;max-width:min(520px,100%)}
.rev .nopic{width:260px;height:64px;border:1px dashed var(--border);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:4px}
.rev .side{display:grid;gap:6px;font-size:12.5px}
.rev .act{display:grid;gap:6px;justify-items:end;min-width:150px}
.btn.confirm{border:1.5px solid #2f8a4f;color:#2f8a4f;background:transparent;font-weight:650}
.btn.confirm:hover{background:#2f8a4f;color:#fff}
.okpill{background:#2f8a4f;color:#fff;border-radius:20px;padding:4px 10px;font-size:12px;font-weight:650;white-space:nowrap}
.sugg{background:#fff7e0;border:1px solid #f0d58a;border-radius:7px;padding:5px 8px}
.progress{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.progress .bar2{width:120px;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress .bar2 i{display:block;height:100%;background:#2f8a4f}
#dlg2{width:min(1100px,calc(100vw - 24px))}
#dlg2 .stage{position:relative;overflow:auto;max-height:75vh;background:#222;border-radius:8px}
#dlg2 canvas{display:block;cursor:crosshair;max-width:100%}
@media (max-width:1300px){.lt{grid-template-columns:200px minmax(0,1fr)} .filters{display:none} .filters.show{display:block;position:fixed;right:0;top:0;bottom:0;z-index:30;width:280px;box-shadow:-8px 0 30px rgba(0,0,0,.2)}}
@media (max-width:1000px){.lt{grid-template-columns:minmax(0,1fr)} .fpane{display:none}}
.lhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--border)}
.lhead select.viewsel{font-weight:650;font-size:15px;border:0;background:transparent;padding-left:0}
.bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:5px 8px}
.tl{padding:8px 16px 24px}
.tr{display:grid;grid-template-columns:22px 34px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--med);border-radius:9px;padding:10px 12px;margin-bottom:7px}
.tr.pri-Low{border-left-color:var(--low)} .tr.pri-High{border-left-color:var(--high)} .tr.pri-Urgent{border-left-color:var(--urgent)}
.tr.sel{background:var(--accent-soft)}
.tr .subj{font-weight:600;font-size:14.5px;color:var(--text);text-decoration:none;overflow-wrap:anywhere}
.tr .subj:hover{color:var(--accent)}
.tr .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.tr .props{display:grid;grid-template-columns:repeat(3,minmax(110px,150px));gap:6px}
.tr .props select{font-size:12.5px;padding:3px 6px;width:100%}
@media (max-width:760px){.tr{grid-template-columns:22px minmax(0,1fr)} .tr .avcell{display:none} .tr .props{grid-column:2;grid-template-columns:repeat(3,minmax(0,1fr))}}
.filters{border-left:1px solid var(--border);background:var(--surface);padding:14px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
.filters h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px}
.filters label.ck{display:flex;align-items:center;gap:6px;font-size:13px;padding:1px 0}
.filters select,.filters input{width:100%}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
/* ticket view */
.tv{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:100%}
@media (max-width:1000px){.tv{grid-template-columns:minmax(0,1fr)}}
.tv .left{padding:14px 18px 40px;min-width:0}
.tv .side{border-left:1px solid var(--border);background:var(--surface);padding:14px}
.tbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.tsub{font-size:20px;line-height:1.3;margin:4px 0 6px;font-weight:650;overflow-wrap:anywhere}
.msg{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin:12px 0;overflow:hidden}
.msg.out{border-color:color-mix(in srgb,var(--accent) 35%,var(--border))}
.msg.note{background:var(--note);border-color:var(--note-border)}
.msg .mh{display:flex;gap:10px;align-items:flex-start;padding:10px 14px 0}
.msg .mh .who{font-weight:650}
.msg .mb{padding:8px 14px 12px 54px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .mb.html{white-space:normal}
[hidden]{display:none!important}
.msg.sms{margin:6px 0;border-radius:8px}
.msg.sms .smh{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px 0;font-size:12px}
.msg.sms .smh .pill{font-size:11px;padding:1px 7px}
.msg.sms .smb{padding:3px 10px 7px 40px;font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.p-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.act-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.act-tbl td,.act-tbl th{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;text-align:left}
.act-tbl th{position:sticky;top:0;background:var(--surface);font-weight:600;color:var(--muted)}
.act-tbl .det{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-width:420px}
.msg .mb.html p{margin:0 0 .5em}
.msg .quoted{color:var(--muted);border-left:3px solid var(--border);padding-left:10px;margin-top:6px}
.msg .atts{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px 54px}
.att{border:1px solid var(--border);border-radius:8px;background:var(--surface);width:150px;overflow:hidden;font-size:12px}
.att .th{height:84px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);cursor:pointer}
.att .th img{width:100%;height:100%;object-fit:cover}
.att .nm{padding:4px 7px;overflow-wrap:anywhere;line-height:1.3}
.att .ac{display:flex;gap:4px;padding:0 6px 6px}
.sys{font-size:12.5px;color:var(--muted);text-align:center;margin:8px 0}
.editor{background:var(--surface);border:1px solid var(--border);border-radius:11px;margin-top:14px}
.editor .tabs{display:flex;border-bottom:1px solid var(--border)}
.editor .tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.editor .tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.editor .fld{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;align-items:center;padding:6px 12px 0}
.editor .fld input{width:100%}
.tool{display:flex;flex-wrap:wrap;gap:2px;padding:6px 10px;border-bottom:1px solid var(--border)}
.tool button{border:0;background:transparent;border-radius:6px;padding:3px 8px;cursor:pointer;font-weight:700}
.tool button:hover{background:var(--surface-2)}
.ce{min-height:150px;max-height:420px;overflow:auto;padding:12px 14px;outline:none}
.ce:empty::before{content:attr(data-ph);color:var(--muted)}
.ce table{border-collapse:collapse} .ce td,.ce th{border:1px solid var(--border);padding:3px 6px}
.efoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--border)}
.side h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 0 8px}
.side h3:first-child{margin-top:0}
.side .f{display:grid;gap:3px;margin-bottom:9px}
.side .f label{font-size:12px;color:var(--muted)}
.side .f select,.side .f input{width:100%}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{background:var(--surface-2);border-radius:6px;padding:1px 7px;font-size:12px;display:inline-flex;gap:4px;align-items:center}
.tag button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0}
.slabox{border:1px solid var(--border);border-radius:9px;padding:8px 10px;font-size:13px;display:grid;gap:4px}
.tline{font-size:12px;color:var(--muted);border-left:2px solid var(--border);padding:0 0 8px 10px;position:relative}
.tline::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--border)}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--text);display:block}
.kpi:hover{border-color:var(--accent)}
.kpi b{display:block;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:12.5px}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:#2f8a4f}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
.panel h2{font-size:14px;margin:0 0 12px}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar .tr2{background:var(--surface-2);border-radius:5px;height:14px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:5px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--border);vertical-align:top}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface-2)}
table.t td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
/* admin */
.adm{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;padding:16px}
@media (max-width:800px){.adm{grid-template-columns:minmax(0,1fr)}}
.adm nav{display:flex;flex-direction:column;gap:2px}
.adm nav a{padding:7px 10px;border-radius:7px;text-decoration:none;color:var(--text)}
.adm nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.adm .panel label.blk{display:grid;gap:4px;margin-bottom:10px;font-size:13px}
.rule{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:10px;display:grid;gap:8px}
/* setup / misc */
.setup{max-width:640px;margin:40px auto;padding:24px}
.setup h2{margin-top:0}
.setup ol{padding-left:18px} .setup li{margin:6px 0}
.setup form label{display:grid;gap:4px;font-size:13px} .setup form input{width:100%;box-sizing:border-box;padding:9px 10px;font-size:15px}
#meAv.av{flex:none}
dialog{border:0;border-radius:14px;padding:0;background:var(--surface);color:var(--text);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,20,.5)}
.dh{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:650;font-size:16px}
.db{padding:14px 18px;display:grid;gap:10px}
.db label{display:grid;gap:3px;font-size:13px}
.df{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 16px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kbd{font-family:Consolas,monospace;font-size:11.5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px}
iframe.orig{width:100%;height:60vh;border:1px solid var(--border);border-radius:8px;background:#fff}
@media (max-width:640px){#availBtn .t{display:none}.top h1{display:none}.sync span.t{display:none}.app{grid-template-columns:52px minmax(0,1fr)}.rail a{width:40px;height:40px}}

    el('details', {}, el('summary', {}, 'Change my password'), el('div', { class: 'row', style: 'margin-top:8px' }, p1, el('button', { class: 'btn', type: 'button', onclick: async () => {
      if (p1.value.length < 8) return toast('At least 8 characters'); const { error } = await SB.auth.updateUser({ password: p1.value }); if (error) return toast(error.message); p1.value = ''; toast('Password changed'); } }, 'Change'))),
    INSTALL.prompt ? el('button', { class: 'btn', type: 'button', onclick: installApp }, '⬇ Install the app on this device') : el('div', { class: 'small muted' }, INSTALL.hint())],
    [el('button', { class: 'btn danger', type: 'button', onclick: signOut }, 'Sign out'), el('button', { class: 'btn primary', type: 'button', onclick: closeDialog }, 'Close')]);
}
/* install as an app (PWA) */
const INSTALL = { prompt: null, hint() { return /iphone|ipad/i.test(navigator.userAgent) ? 'To install on iPhone: Share button › “Add to Home Screen”.' : matchMedia('(display-mode: standalone)').matches ? 'Running as an installed app.' : 'To install: browser menu › “Install app” / “Add to Home screen”.'; } };
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL.prompt = e; $('#installBtn').hidden = false; });
async function installApp() { if (!INSTALL.prompt) return toast(INSTALL.hint()); INSTALL.prompt.prompt(); await INSTALL.prompt.userChoice; INSTALL.prompt = null; $('#installBtn').hidden = true; closeDialog(); }
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => { reg.update().catch(() => { }); window.addEventListener('focus', () => reg.update().catch(() => { })); }).catch(() => { });
}
// new version published -> reload once to use it (only when no dialog / editor is open, so nobody loses typing)
const APP_VERSION = '2026-11-16h';
async function checkVersion() {
  try {
    const h = await (await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' })).text();
    const m = h.match(/const APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) {
      const busy = $('#dlg').open || [...document.querySelectorAll('.ce, textarea')].some(x => (x.value || x.textContent || '').trim());
      if (!busy) location.reload(); else if (!checkVersion.told) { checkVersion.told = true; toast('A new version of the app is ready – it loads next time you open it.'); }
    }
  } catch { }
}
setInterval(checkVersion, 5 * 60000); window.addEventListener('focus', checkVersion);

/* =====================================================================
   Start
   ===================================================================== */
$('#searchForm').addEventListener('submit', e => { e.preventDefault(); const q = $('#q').value.trim(); location.hash = '#/tickets?view=all' + (q ? '&q=' + encodeURIComponent(q) : ''); });
$('#newBtn').onclick = () => DB ? newTicketDialog() : toast('Sign in first');
$('#meBtn').onclick = () => accountDialog();
$('#meBtn').onkeydown = e => { if (e.key === 'Enter') accountDialog(); };
$('#installBtn').onclick = installApp;
document.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); return; }
  if (CUR.view && CUR.view.keys && CUR.view.keys(e.key)) e.preventDefault();
});
window.addEventListener('focus', () => poll());
setInterval(() => poll(), 30000);
(async () => {
  await IDB.open();
  if (!SB) return showSetup();
  SB.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && ME) { ME = null; DB = null; showSetup(); } });
  start();
})();
window.HD_TEST = { FS, SB, emit, poll, importFile, get DB() { return DB; }, STORE, fold, runImporter };
</script>
